name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-api -> target
      - name: Build
        working-directory: backend/rust-api
        run: cargo build --locked
      - name: Test
        working-directory: backend/rust-api
        run: cargo test --locked

  python:
    name: Analytics — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/python-services/requirements.txt
      - name: Install dependencies
        working-directory: backend/python-services
        run: pip install -r requirements.txt pytest
      - name: Test
        working-directory: backend/python-services
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
