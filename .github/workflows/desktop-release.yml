name: Desktop Release

# Builds macOS + Windows installers ONLY when a desktop tag is pushed
# (e.g. `git tag desktop-v0.1.0 && git push --tags`).
# GitHub Actions is free for public repositories.

on:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AgentX Desktop ${{ github.ref_name }}"
          releaseBody: "Native desktop app for macOS and Windows. Wraps the AgentX web app in a lightweight Tauri shell (~10 MB)."
          releaseDraft: true
          args: ${{ matrix.args }}
