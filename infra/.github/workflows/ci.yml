name: AgentX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Lint all codebases
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -- Rust linting --
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-api -> target

      - name: Check Rust formatting
        working-directory: backend/rust-api
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        working-directory: backend/rust-api
        run: cargo clippy --all-targets --all-features -- -D warnings

      # -- Python linting --
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/python-services/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install Python linting tools
        run: pip install ruff mypy

      - name: Run Ruff linter
        working-directory: backend/python-services
        run: ruff check app/

      - name: Run Ruff format check
        working-directory: backend/python-services
        run: ruff format --check app/

      # -- Frontend linting --
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run type-check

  # ============================================================================
  # Rust API tests
  # ============================================================================
  test-rust:
    name: Test Rust API
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentx_test
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://agentx:agentx@localhost:5432/agentx_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-api -> target

      - name: Build Rust API
        working-directory: backend/rust-api
        run: cargo build --all-targets

      - name: Run Rust tests
        working-directory: backend/rust-api
        run: cargo test --all-targets -- --nocapture

  # ============================================================================
  # Python analytics tests
  # ============================================================================
  test-python:
    name: Test Python Analytics
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentx_test
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://agentx:agentx@localhost:5432/agentx_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/python-services/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend/python-services
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python tests
        working-directory: backend/python-services
        run: pytest tests/ -v --cov=app --cov-report=term-missing --tb=short || echo "No tests found yet - skipping"

  # ============================================================================
  # Build Docker images (validates all Dockerfiles)
  # ============================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (Rust)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-rust
          key: ${{ runner.os }}-buildx-rust-${{ hashFiles('backend/rust-api/Cargo.toml', 'backend/rust-api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-rust-

      - name: Cache Docker layers (Python)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-python
          key: ${{ runner.os }}-buildx-python-${{ hashFiles('backend/python-services/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-python-

      - name: Cache Docker layers (Frontend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Build Rust API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.rust
          push: false
          tags: agentx/rust-api:ci
          cache-from: type=local,src=/tmp/.buildx-cache-rust
          cache-to: type=local,dest=/tmp/.buildx-cache-rust-new,mode=max

      - name: Build Python Analytics image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.python
          push: false
          tags: agentx/python-analytics:ci
          cache-from: type=local,src=/tmp/.buildx-cache-python
          cache-to: type=local,dest=/tmp/.buildx-cache-python-new,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.frontend
          push: false
          tags: agentx/frontend:ci
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      # Rotate caches to avoid unbounded cache growth
      - name: Rotate Docker caches
        run: |
          rm -rf /tmp/.buildx-cache-rust
          rm -rf /tmp/.buildx-cache-python
          rm -rf /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-rust-new /tmp/.buildx-cache-rust || true
          mv /tmp/.buildx-cache-python-new /tmp/.buildx-cache-python || true
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend || true
